<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form">
        
        <div class="layui-form-item">
            <label class="layui-form-label">登陆者ID</label>
            <div class="layui-input-block">
                <input type="text" name="admin_id" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}登陆者ID" value="{$row.admin_id|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">登陆者账号</label>
            <div class="layui-input-block">
                <input type="text" name="username" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}登陆者账号" value="{$row.username|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">登陆者IP</label>
            <div class="layui-input-block">
                <input type="text" name="ip" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}登陆者IP" value="{$row.ip|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">地址</label>
            <div class="layui-input-block">
                <input type="text" name="area" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}地址" value="{$row.area|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">0未知登陆方式1电脑登录2手机登录方式</label>
            <div class="layui-input-block">
                <input type="text" name="login_side" class="layui-input"  placeholder="{:fy('Please enter')}0未知登陆方式1电脑登录2手机登录方式" value="{$row.login_side|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">登录时间</label>
            <div class="layui-input-block">
                <input type="text" name="createtime" class="layui-input"  placeholder="{:fy('Please enter')}登录时间" value="{$row.createtime|default=''}">
            </div>
        </div>
        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>

<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form">
        
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Group Name')}</label>
            <div class="layui-input-block">
                <input type="text" name="name" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}{:fy('Group Name')}" value="">
            </div>
            <div class="layui-input-block">
                <div class="layui-form-mid layui-word-aux">{:fy('Group Name')}{:fy('Must be unique')}</div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Sort')}</label>
            <div class="layui-input-block">
                <input type="text" name="sort" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}{:fy('Sort')}" value="100">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Status')}</label>
            <div class="layui-input-block">
                {foreach $getStatusList as $k=>$v}
                <input type="radio" name="status" value="{$k}" title="{$v}" {in name="k" value="1"}checked=""{/in}>
                {/foreach}
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Identification')}</label>
            <div class="layui-input-block">
                <input type="text" name="identification" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}{:fy('Identification')}" value="">

            </div>
            <div class="layui-input-block">
                <div class="layui-form-mid layui-word-aux">{:fy('Please use English letters to identify and guarantee uniqueness')}</div>
            </div>
        </div>
        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
                        <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>

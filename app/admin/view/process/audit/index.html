<script>

    layui.use(['table','form','upload','util','laydate'], function() {
        var table = layui.table,form = layui.form, $ = layui.jquery;
        var tableIn = table.render({
            elem: '#table-list',
            url: '{:url("index")}',
            method: 'post',
            toolbar: '#topBtn',
            defaultToolbar:['filter','print','exports'],
            cols: [[
                {checkbox:true,fixed: true},
                {field: 'id', title: 'ID', fixed: true, width: 80},
                {field: 'username', title: "{:fy('Originator')}", width: 100},
                {field: 'title', title: "{:fy('Type')}", width: 100},
                {field: 'mess', title: "{:fy('Content')}",width: 200 },
                {field: 'createtime', title: "提交时间",templet:function (res) {
                        return new Date(res.createtime*1000).format('Y-m-d H:i:s');
                    },width: 160 },
                {field: 'result', title: "审批状态" },
                {field: 'result_mess', title: "审批内容",width: 200 },
                {field: 'reviewer', title: "审批者" },
                {field: 'audittime', title: "审批时间" ,templet:function (res) {
                    if(res.audittime<1)return '';
                        return new Date(res.audittime*1000).format('Y-m-d H:i:s');

                    }},
                {title: "{:fy('Operate')}",align: 'center', toolbar: '#action'}
            ]],
            limit: {$system['admin_pagesize']}, //每页默认显示的数量

            page: {limits:[10, 20, 30, 40, 50,100]},
        });


        table.on('tool(table-list)', function(obj) {
            var data = obj.data;

            if (obj.event === 'del') {
                layer.confirm('{:fy("Are you sure you want to delete")}'+'？', function(index){
                    var loading = layer.load(1, {shade: [0.1, '#fff']});
                    $.post("{:url('del')}",{id:data.id},function(res){
                        layer.close(loading);
                        if(res.code===0){
                            layer.msg(res.msg,{time:2000,icon:1});
                            tableIn.reload();
                        }else{
                            layer.msg('{:fy("Operation failed")}'+'！',{time:2000,icon:2});
                        }
                    });
                    layer.close(index);
                });
            }
            else if(obj.event === 'audit'){
                layer.open({
                    type: 2,
                    title: data.title,
                    shadeClose: true,
                    shade: false,
                    area: ['80%', '100%'],
                    content: CONFIG.MODULEURL + '/' +data.url+'&audit_management_id='+data.id
                });
            }
        });


        //监听事件
        table.on('toolbar(table-list)', function(obj){

            var checkStatus = table.checkStatus(obj.config.id)
                ,data = checkStatus.data; //获取选中的数据
            switch(obj.event){
                case 'selectDel':
                    if(data.length > 0){
                        alterList = [];  //定义需要转移的数组
                        data.forEach(function (obj,index) {
                            alterList.push(obj.id);
                        });
                        currConfirm = layer.confirm('{:fy("Are you sure you want to delete the checked information")}'+'？',function (index) {
                            var loading = layer.load(1, {shade: [0.1, '#fff']});
                            $.post("{:url('del')}",{id:alterList},function(res){
                                layer.close(loading);
                                if(res.code===0){
                                    layer.msg(res.msg,{time:2000,icon:1});
                                    tableIn.reload();
                                }else{
                                    layer.msg('{:fy("Operation failed")}'+'！',{time:2000,icon:2});
                                }
                            });
                            layer.close(index);
                        });
                    }else {
                        layer.msg("{:fy('Please check the required information first')}");
                    }
                    break;
            };
        });


//监听搜索
        form.on('submit(LAY-app-contlist-search)', function(data){
            var field = data.field;
            table.reload('table-list', {
                url:"{:url('index')}",
                where: {
                    keyword: data.field
                },
                page:{
                    curr:1
                }
            });


        });
    });
</script>


<script>

    /*添加*/
    function layer_add(title,url){
        
        var indexOpen = layer.open({
            type: 2,
            title: title,
            closeBtn: 1, //是否显示关闭按钮
            area: ['100%','80%'],
            anim: 2,  //动画
            shadeClose: false,  //点击空白处是否关闭
            maxmin: true, //开启最大化最小化按钮
            content:[url],
        });
    }
</script>

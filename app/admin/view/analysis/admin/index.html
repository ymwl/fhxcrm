<div class="layuimini-container">
  <div class="layuimini-main">
    <div class="layui-card">
      <div class="layui-card-header">客户量趋势</div>
      <div class="layui-card-body">
        <div  class="layui-form-item">
          <div class="layui-input-inline">
            <input type="text" name="owner_admin_id" data-toggle="selectPage" class="layui-input" data-source="{:myurl('admin/selectpage')}"  data-field="username"  data-format-item="{username}"  data-primary-key="admin_id"  placeholder="查看指定业务员" data-params='{"custom[is_open]":"1"}'  lay-verify="required" id="owner_admin_id">
          </div>
          <a href="javascript:;" class="layui-btn  layui-btn-success btn-filter" data-value="last7Days">最近7天</a>
          <a href="javascript:;" class="layui-btn  layui-btn-success btn-filter" data-value="last30Days">最近30天</a>
          <a href="javascript:;" class="layui-btn  layui-btn-success btn-filter" data-value="lastMonth">上月</a>
          <a href="javascript:;" class="layui-btn  layui-btn-success btn-filter" data-value="thisMonth">本月</a>

          <div class="layui-input-inline" style="width: 300px;">
            <input value="" placeholder="指定日期" class="layui-input form-control input-inline datetimerange" autocomplete="off" id="datetimerange" data-url="{:myurl('analysis.admin/index',['ajax'=>1])}" data-admin_id="0" data-charttype="order">
          </div>
        </div>

        <div id="order-echart" class="btn-refresh" style="height:200px;width:100%;">

        </div>
      </div>
    </div>

    <table id="currentTable" class="layui-table layui-hide"
           lay-filter="currentTable">
    </table>
  </div>
</div>

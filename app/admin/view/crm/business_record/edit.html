<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form">
        
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Client name')}</label>
            <div class="layui-input-block">
                <input type="text" name="khname" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}{:fy('Client name')}" value="{$row.khname|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">联系电话</label>
            <div class="layui-input-block">
                <input type="text" name="khphone" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}联系电话" value="{$row.khphone|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">跟进者ID</label>
            <div class="layui-input-block">
                <input type="text" name="admin_id" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}跟进者ID" value="{$row.admin_id|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">跟进者</label>
            <div class="layui-input-block">
                <input type="text" name="pr_user" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}跟进者" value="{$row.pr_user|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">被跟进的客户ID</label>
            <div class="layui-input-block">
                <input type="text" name="customer_id" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}被跟进的客户ID" value="{$row.customer_id|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">跟进内容</label>
            <div class="layui-input-block">
                <textarea name="content" rows="20" class="layui-textarea editor" placeholder="勤跟进，多签单">{$row.content|raw|default=''}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"> {:fy('Next follow-up time')}</label>
            <div class="layui-input-block">
                <input type="text" name="next_time" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')} {:fy('Next follow-up time')}" value="{$row.next_time|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"> {:fy('Follow up type')}</label>
            <div class="layui-input-block">
                <input type="text" name="record_type" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')} {:fy('Follow up type')}" value="{$row.record_type|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Attachment')}</label>
            <div class="layui-input-block">
                <input type="text" name="attach" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')} {:fy('Attachment')}" value="{$row.attach|default=''}">
            </div>
        </div>
        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>

<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form layui-form-pane">

        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">
        <div class="layui-form-item">
            <label class="layui-form-label">客户名称</label>
            <div class="layui-input-block">
                <input type="hidden" name="customer_id" value="{$contract_row['customer_id']|default=0}">
                <input type="text" class="layui-input" lay-verify="required" value="{$contract_row['crmCustomer']['name']|default=''}" readonly>
            </div>
        </div>
        </div>
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">
        <div class="layui-form-item">
            <label class="layui-form-label">合同名称</label>
            <div class="layui-input-block">
                <input type="hidden" name="contract_id" value="{$contract_row['id']|default=0}">
                <input type="text" class="layui-input" lay-verify="required" value="{$contract_row['name']|default=''}" readonly>
            </div>
        </div>
        </div>

        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">
            <div class="layui-form-item">
                <label class="layui-form-label">回款计划</label>
                <div class="layui-input-block">
                    <select name="receivables_plan_id" lay-search="" lay-filter="receivables_plan_id">
                        <option value="0">不关联回款计划</option>
                        {foreach $receivablesPlans as $plan}
                        <option value="{$plan.id}" data-money="{$plan.plan_money}">{$plan.plan_no} - 计划金额:{$plan.plan_money}元</option>
                        {/foreach}
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">
            <div class="layui-form-item">
                <label class="layui-form-label required">回款编号</label>
                <div class="layui-input-block layuimini-upload">
                    <input type="text" name="numbering" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}回款编号" value="{$numbering}">
                    <div class="layuimini-upload-btn">
                        <span class="layui-btn" id="create_numbering">生成</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">
        <div class="layui-form-item">
            <label class="layui-form-label  required">回款日期</label>
            <div class="layui-input-block">
                <input type="text" name="return_time" class="layui-input"  placeholder="请输入回款日期" value="{:date('Y-m-d H:i')}" data-date="yyyy-MM-dd HH:mm" data-date-type="date">
            </div>
        </div>
        </div>
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">
        <div class="layui-form-item">
            <label class="layui-form-label">回款金额</label>
            <div class="layui-input-block">
                <input type="text" name="money" class="layui-input" lay-verify="required" placeholder="请输入回款金额" value="0.00">
            </div>
        </div>

        </div>

        {$fields_str|raw}
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md6 layui-col-lg6">


        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" class="layui-textarea  textarea"  placeholder="请输入备注"></textarea>
            </div>
        </div>
        </div>
        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
                        <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>

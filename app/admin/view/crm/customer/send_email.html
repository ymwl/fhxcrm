<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form">
        <div class="layui-row">
            <div class="layui-form-item">
                <label class="layui-form-label">收件邮箱</label>
                <div class="layui-input-block">
                    <!-- 增加客户id隐藏域 -->
                    <input type="hidden" name="customer_id" value="{$id}">
                    <input type="text" name="to_email" class="layui-input" lay-verify="required|email" placeholder="请输入收件邮箱" value="{$row.email|default=''}">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">邮件模板</label>
                <div class="layui-input-block">
                    <select name="emailtpl_id" lay-filter="emailtpl">
                        <option value="">快捷选择邮件模板</option>
                        {volist name="emailtpl" id="vo"}
                        <option value="{$vo.id}">{$vo.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">邮件标题</label>
                <div class="layui-input-block">
                    <input type="text" name="subject" class="layui-input" lay-verify="required" placeholder="请输入邮件标题" value="">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">邮件内容</label>
                <div class="layui-input-block">
                    <textarea name="email_content" id="email_content" class="layui-textarea editor" rows="15" placeholder="请输入邮件内容"></textarea>
                </div>
            </div>
        </div>

        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>

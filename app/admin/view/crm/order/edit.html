<div class="layuimini-container">
    <form class="layui-form layui-form-pane">
        <input type="hidden" value="{$result.id}" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('customer')}</label>
            <div class="layui-input-block">

                <input type="hidden" name="customer_id" data-rule="required" value="{$result.customer_id}">

                <a href="javascript:void(0)" class="layui-input" data-id="customer_id" data-title="选择客户" data-name="" open-select="crm.customer/index?isselect=1">{$result.cname|default='【请点击选择】'}</a>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">联系人</label>
            <div class="layui-input-block">
                <input type="text" id="ccontact" name="ccontact"  placeholder="请填写联系人" class="layui-input" value="{$result.ccontact|default=''}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" id="cphone" name="cphone"  placeholder="请填写联系人手机号" class="layui-input" value="{$result.cphone|default=''}">
            </div>
        </div>

        <!-- 增加收货地址 -->
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('收货地址')}</label>
            <div class="layui-input-block">
                <input type="text" id="address" name="address"  placeholder="{:fy('Please enter')}{:fy('收货地址')}" class="layui-input" value="{$result.address|default=''}">
            </div>
        </div>


        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Order number')}</label>
            <div class="layui-input-block">
                <input type="text" id="orderno" name="orderno"  placeholder="{:fy('Please enter')}{:fy('Order number')}" class="layui-input" value="{$result.orderno}" readonly>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('amount')}</label>
            <div class="layui-input-block">
                <input type="text" id="money" name="money"  placeholder="{:fy('Please enter')}金额" class="layui-input" value="{$result.money}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Freight')}</label>
            <div class="layui-input-block">
                <input type="text" id="freight" name="freight"  placeholder="{:fy('Please enter')}{:fy('Freight')}" class="layui-input" value="{$result.freight}">
            </div>
        </div>
        <div class="layui-row">
        {$fields_str|raw}
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Remark')}</label>
            <div class="layui-input-block">
                <textarea placeholder="{:fy('Please enter')}{:fy('note information')}" class="layui-textarea" name="remark">{$result.remark}</textarea>
            </div>
        </div>

        <div class="hr-line"></div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button type="button" class="layui-btn"  lay-submit lay-filter="submit">提交审核</button>

            </div>
        </div>

    </form>
</div>

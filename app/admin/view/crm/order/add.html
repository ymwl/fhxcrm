<div class="layuimini-container">
    <blockquote class="layui-elem-quote">
    </blockquote>
        <form id="app-form" class="layui-form layuimini-form">

            <div class="layui-form-item">
                <label class="layui-form-label">{:fy('customer')}</label>
                <div class="layui-input-block">

                    <input type="hidden" name="customer_id" data-rule="required" value="{$customer_id}"><a href="javascript:void(0)" class="layui-input" data-id="customer_id" data-title="选择客户" data-name="" open-select="crm.customer/index?isselect=1">{$row_customer.name|default='【请点击选择】'}</a>
                </div>
            </div>

        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Order number')}</label>
            <div class="layui-input-block layuimini-upload">
                <input type="text" id="orderno" name="orderno"  placeholder="{:fy('Please enter')}{:fy('Order number')}" class="layui-input" value="{$orderno}" >
                <div class="layuimini-upload-btn">
                    <span class="layui-btn" id="create_orderno">生成</span>
                </div>
            </div>
        </div>

            <div class="layui-form-item">
                <label class="layui-form-label">联系人</label>
                <div class="layui-input-block">
                    <input type="text" id="ccontact" name="ccontact"  placeholder="请填写联系人" class="layui-input" value="{$row_customer.contact|default=''}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">手机号</label>
                <div class="layui-input-block">
                    <input type="text" id="cphone" name="cphone"  placeholder="请填写联系人手机号" class="layui-input" value="{$row_customer.phone|default=''}">
                </div>
            </div>

            <!-- 增加收货地址 -->
            <div class="layui-form-item">
                <label class="layui-form-label">{:fy('收货地址')}</label>
                <div class="layui-input-block">
                    <input type="text" id="address" name="address"  placeholder="{:fy('Please enter')}{:fy('收货地址')}" class="layui-input" value="{$row_customer.area|default=''}{$row_customer.address|default=''}">
                </div>
            </div>

        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('amount')}</label>
            <div class="layui-input-block">
                <input type="text" id="money" name="money"  placeholder="{:fy('Please enter')}{:fy('amount')}" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Freight')}</label>
            <div class="layui-input-block">
                <input type="text" id="freight" name="freight"  placeholder="{:fy('Please enter')}{:fy('Freight')}" class="layui-input">
            </div>
        </div>
            <div class="layui-row">
        {$fields_str|raw}
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">{:fy('Remark')}</label>
            <div class="layui-input-block">
                <textarea placeholder="{:fy('Please enter')}{:fy('Order Remarks')}" class="layui-textarea" name="remark"></textarea>
            </div>
        </div>

            <div class="hr-line"></div>
            <div class="layui-form-item text-center">
                <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Save')}</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
            </div>

    </form>
</div>

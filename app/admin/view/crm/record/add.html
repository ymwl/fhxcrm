<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form">
        
        <div class="layui-form-item">
            <label class="layui-form-label">被跟进的客户ID</label>
            <div class="layui-input-block">
                <input type="text" name="customer_id" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}被跟进的客户ID" value="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">跟进者</label>
            <div class="layui-input-block">
                <input type="text" name="username" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')}跟进者" value="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">跟进内容</label>
            <div class="layui-input-block">
                <textarea name="content" rows="20" class="layui-textarea editor" 跟进内容 placeholder="{:fy('Please enter')}跟进内容"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"> {:fy('Follow up type')}</label>
            <div class="layui-input-block">
                <input type="text" name="record_type_id" class="layui-input" lay-verify="required" placeholder="{:fy('Please enter')} {:fy('Follow up type')}" value="0">
            </div>
        </div>
        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>

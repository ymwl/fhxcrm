<div class="layuimini-container">
    <form id="app-form" class="layui-form layuimini-form layui-form-pane">
        
        <div class="layui-form-item">
            <label class="layui-form-label">中文名</label>
            <div class="layui-input-block">
                <input type="text" name="title" class="layui-input" lay-verify="required" placeholder="请输入中文名" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">插件名或标识</label>
            <div class="layui-input-block">
                <input type="text" name="name" class="layui-input" lay-verify="required" placeholder="请输入插件名或标识" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">封面</label>
            <div class="layui-input-block">
                <input type="text" name="thumb" class="layui-input"  placeholder="请输入封面" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">组别</label>
            <div class="layui-input-block">
                <input type="text" name="group" class="layui-input"  placeholder="请输入组别" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">插件描述</label>
            <div class="layui-input-block">
                <input type="text" name="description" class="layui-input"  placeholder="请输入插件描述" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">作者</label>
            <div class="layui-input-block">
                <input type="text" name="author" class="layui-input"  placeholder="请输入作者" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">版本号</label>
            <div class="layui-input-block">
                <input type="text" name="version" class="layui-input"  placeholder="请输入版本号" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">需求版本</label>
            <div class="layui-input-block">
                <input type="text" name="requires" class="layui-input" lay-verify="required" placeholder="请输入需求版本" value=" ">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">网址</label>
            <div class="layui-input-block">
                <input type="text" name="website" class="layui-input"  placeholder="请输入网址" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">钩子[0:不支持;1:支持]</label>
            <div class="layui-input-block">
                <input type="text" name="is_hook" class="layui-input"  placeholder="请输入钩子[0:不支持;1:支持]" value="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态[-1:删除;0:禁用;1启用]</label>
            <div class="layui-input-block">
                <input type="text" name="status" class="layui-input"  placeholder="请输入状态[-1:删除;0:禁用;1启用]" value="1">
            </div>
        </div>
        <div class="hr-line"></div>
        <div class="layui-form-item text-center">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit>{:fy('Confirm')}</button>
                        <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">{:fy('Reset')}</button>
        </div>

    </form>
</div>
